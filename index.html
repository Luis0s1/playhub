<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayHub</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilo do aviso de atualização */
    .update-banner {
      display: none;
      background-color: #ff9800;
      color: #000;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .update-banner button {
      margin-left: 10px;
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      background-color: #fff;
      font-weight: bold;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <!-- Banner de aviso se houver atualização -->
  <div id="updateBanner" class="update-banner">
    ⚠️ Seus arquivos locais estão desatualizados ou incompletos!
    <button onclick="forceGithubUpdate()">Atualizar pelo GitHub</button>
  </div>

  <header>
    <h1>PlayHub</h1>
    <input type="text" id="searchInput" placeholder="Pesquisar sites ou jogos..." oninput="handleSearch(this.value)">
  </header>

  <main id="app">
    <div id="sitesGrid" class="grid">
      <!-- Os cards dos sites serão inseridos aqui -->
    </div>
  </main>

  <script src="sites.js"></script>

  <script>
    // Mostra o aviso na tela se o sites.js detetar que está desatualizado
    function showUpdateNotice() {
      const banner = document.getElementById('updateBanner');
      if (banner) banner.style.display = 'block';
    }

    // Força o recarregamento baixando os dados do GitHub
    async function forceGithubUpdate() {
      if (typeof fetchFromGithubOnly === 'function') {
        await fetchFromGithubOnly();
        document.getElementById('updateBanner').style.display = 'none';
      }
    }

    // Renderiza os cartões na tela
    function renderSites(lista) {
      const container = document.getElementById('sitesGrid');
      if (!container) return;
      
      container.innerHTML = '';

      if (!lista || lista.length === 0) {
        container.innerHTML = '<p class="empty-msg">Nenhum site encontrado.</p>';
        return;
      }

      lista.forEach(site => {
        if (site.isHidden) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            ${site.iconData ? `<img src="${site.iconData}" alt="${site.name}" class="icon">` : '<div class="icon-placeholder">🌐</div>'}
            <h3>${site.name}</h3>
          </div>
          <p>${site.description || ''}</p>
          <div class="tags">
            ${(site.tags || []).map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="btn-link">Acessar</a>
        `;
        container.appendChild(card);
      });
    }

    function handleSearch(query) {
      if (typeof searchSites === 'function') {
        const resultados = searchSites(query);
        renderSites(resultados);
      }
    }
  </script>

</body>
</html>
